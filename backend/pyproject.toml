[project]
name = "paperpal-api"
version = "0.2.0"
description = "Evidence-grounded academic research assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.24,<2",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.9,<3",
  "langchain-core>=1.0,<2",
  "langchain-groq>=1.0,<2",
  "langchain-chroma>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.0,<2",
  "chromadb>=1.0,<2",
  "celery[redis]>=5.4,<6",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpal"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"src/paperpal/agents/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
